<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pigeon Translator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>PIGEON TRANSLATOR</h1>

        <button
            id="record-button"
            type="button"
            aria-pressed="false"
        >
            Start recording
        </button>

        <p id="status" role="status" aria-live="polite">
            Tap to start, then tap again to stop.
        </p>

        <p class="keyboard-hint">
            On a computer, you can also hold the spacebar.
        </p>
    </main>
</body>
</html>
