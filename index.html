<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pigeon Translator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>PIGEON TRANSLATOR</h1>
<p class="browser-notice">
    best for use in chrome or on desktop.
    recording and sound may not work on other platforms.
</p>
        <button
            id="record-button"
            type="button"
            aria-pressed="false"
        >
            speak pigeon now!
        </button>

        <p id="status" role="status" aria-live="polite">
            tap to start and stop.
        </p>

        <p class="keyboard-hint">
       spacebar available on other devices
        </p>
    </main>
</body>
</html>
